[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climagrid"
version = "0.2.0"
description = "Climate data, grid-ready: standards-based environmental stress features for grid equipment, from free NOAA, NASA, USDA, and USFS data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Temidire Adesiji" }]
keywords = [
    "NOAA", "NASA", "USDA", "electric utility", "predictive maintenance",
    "grid resilience", "rural cooperative", "climate", "weather",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "xarray>=2024.1",
    "pandas>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.5",
    "requests>=2.31",
    "httpx>=0.25",
    "scipy>=1.11",
    "numpy>=1.24",
    "shapely>=2.0",
    "pydantic>=2.0",
    "click>=8.0",
]

[project.optional-dependencies]
noaa-nwp = [
    "herbie-data>=2024.3",
    "cfgrib>=0.9",
]
nasa = [
    "pvlib>=0.10",
]
met = [
    "metpy>=1.5",
]
report = [
    "weasyprint>=60",
    "matplotlib>=3.7",
]
full = [
    "climagrid[noaa-nwp,nasa,met,report]",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
    "ruff>=0.1",
    "mypy>=1.5",
    # Pinned exactly: pandas-stubs type inference changes between releases, so an
    # unpinned range lets local and CI resolve different versions and disagree.
    "pandas-stubs==3.0.0.260204",
    "types-requests>=2.31",
    "ipykernel>=6.25",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "plotext>=5.2",
    "pyarrow>=14.0",
    "hypothesis>=6.0",
    "scikit-learn>=1.3",
    "pre-commit>=3.5",
    # matplotlib (but not weasyprint) so the report map-rendering tests run in CI.
    # weasyprint needs system libraries (pango/cairo) and stays in [report] only,
    # to keep `pip install -e ".[dev]"` working on bare CI runners.
    "matplotlib>=3.7",
]
docs = [
    "sphinx>=7.0",
    "furo>=2023.9",
    "sphinx-autodoc-typehints>=1.24",
    "myst-parser>=2.0",
]

[project.scripts]
climagrid = "climagrid.cli:main"

[project.urls]
Homepage = "https://github.com/TemidireAdesiji/climagrid"
Documentation = "https://climagrid.readthedocs.io"
Repository = "https://github.com/TemidireAdesiji/climagrid"
Issues = "https://github.com/TemidireAdesiji/climagrid/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/climagrid"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=climagrid --cov-report=term-missing -v"
pythonpath = ["src"]
markers = [
    "integration: marks tests that call live APIs (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["climagrid"]
omit = ["tests/*"]

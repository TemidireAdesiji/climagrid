name: Close stale issues and PRs

on:
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is further activity. If it is still relevant, please leave a comment.
          stale-pr-message: >
            This pull request has been inactive for 60 days. It will be closed in 14 days
            unless there is further activity. If you are still working on it, please leave a comment.
          close-issue-message: "Closing due to inactivity. Feel free to reopen if this is still relevant."
          close-pr-message: "Closing due to inactivity. Feel free to reopen if you resume work."
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "help wanted,good first issue"
